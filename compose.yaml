services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: loungcheu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only}
      POSTGRES_DB: loung-cheu-database
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: loungcheu
      POSTGRES_PASSWORD: test_only
      POSTGRES_DB: loungcheu_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
