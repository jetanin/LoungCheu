# Issue #19 / Guide Episode 7: reviewed merges to main trigger this release.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: full SHA of an existing team image. Empty means test/build/release main.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: scccd8b05
      MIGRATE_JOB_NAME: scccd8b05-migrate
      SESSION_SECRET_REF: ${{ vars.SESSION_SECRET_REF || 'scccd8b05-app-secret-1:1' }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}
      DRY_RUN: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate assigned course resources
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          [[ "$PROJECT_ID" == 'cpe-se-course-2026' ]]
          [[ "$REGION" == 'asia-southeast1' ]]
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

      - name: Authenticate without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push this team's image
        if: env.ROLLBACK != 'true'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --project="$PROJECT_ID" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/scccd8b05/scccd8b05:$IMAGE_TAG"
          docker build --platform linux/amd64 --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Verify image, migrate and update the existing service
        run: bash deploy/release.sh

      - name: Smoke test the actual release version
        run: python3 deploy/smoke_test.py "$SERVICE_URL" --expected-commit "$IMAGE_TAG"

      - name: Record deployment
        run: |
          {
            echo '### LoungCheu course deployment'
            printf -- '- Image commit: `%s`\n' "$IMAGE_TAG"
            printf -- '- Digest: `%s`\n' "$DEPLOYED_IMAGE"
            printf -- '- Revision: `%s`\n' "$DEPLOYED_REVISION"
            printf -- '- Rollback: %s\n' "$ROLLBACK"
            printf -- '- URL: %s\n' "$SERVICE_URL"
            echo '- Read-only smoke passed: health, DB readiness, release SHA, SPA and anonymous-access checks.'
            echo '- Manual C-04 login/business evidence is recorded separately.'
          } >> "$GITHUB_STEP_SUMMARY"
